<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PokeForge</title>
<meta name="description" content="포켓몬을 확률로 강화하고 진화시켜 최강에 도전하는 비공식 팬 게임. 1025종 도감, 가방 패시브, 상점.">
<meta name="theme-color" content="#0c0f24">
<meta property="og:title" content="PokeForge">
<meta property="og:description" content="강화하고, 진화하고, 최강에 도전하라!">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0f24; --bg2:#151a3c; --panel:#1a2048; --panel2:#232b5e; --line:#37408a;
  --text:#eef0ff; --mute:#9aa3d6; --gold:#ffd23f; --ok:#4ade80; --bad:#f87171; --warn:#fb923c;
  --aura:#9aa6c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 50% -10%,#3a3f9a55,transparent),radial-gradient(700px 500px at 100% 100%,#c2410c33,transparent),var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
h2,h3{margin:0}
#app{max-width:560px;margin:0 auto;padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;position:relative}
.gold{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.gold .coin{color:var(--gold);font-weight:900;font-size:20px}
.gold b{font-size:clamp(20px,6vw,28px);font-variant-numeric:tabular-nums;color:var(--gold);overflow-wrap:anywhere}
.best{font-size:12px;color:var(--mute);text-align:right;line-height:1.3}
.best b{color:var(--text);font-size:15px}
.iconbtn{background:#ffffff14;border-radius:10px;padding:6px 10px}
.float{position:absolute;left:44px;top:100%;margin-top:-4px;font-weight:800;font-size:18px;pointer-events:none;font-variant-numeric:tabular-nums;z-index:5;text-shadow:0 2px 6px #000}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 2px;font-weight:700;font-size:13px;color:var(--mute)}
.tabs button.on{background:linear-gradient(180deg,#ffd23f,#f59e0b);color:#2b1c00;border-color:#ffd23f}
.tab{display:none;flex-direction:column;gap:12px}
.tab.on{display:flex}

/* stage */
.stage{position:relative;height:310px;border-radius:20px;border:2px solid var(--line);overflow:hidden;
  background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--aura) 40%,transparent),transparent 55%),linear-gradient(180deg,#1b2155,#10143a)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 36px),repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 36px)}
.ped{position:absolute;left:50%;bottom:34px;width:230px;height:54px;margin-left:-115px;border-radius:50%;
  background:radial-gradient(ellipse,color-mix(in srgb,var(--aura) 70%,#fff) 0,var(--aura) 35%,transparent 70%);opacity:.55;filter:blur(1px)}
.aura{position:absolute;left:50%;bottom:50px;width:250px;height:250px;margin-left:-125px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--aura) 55%,transparent),transparent 68%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.monbox{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;align-items:flex-end;height:230px}
.monbox img{image-rendering:pixelated;max-width:260px;max-height:230px;filter:drop-shadow(0 8px 6px #0007);animation:bob 2.2s ease-in-out infinite}
.monbox img.shiny{filter:hue-rotate(150deg) saturate(1.4) drop-shadow(0 0 10px #ffe66d)}
@keyframes bob{50%{transform:translateY(-8px)}}
.lvbadge{position:absolute;left:12px;top:10px;background:#000a;border:2px solid var(--aura);color:#fff;font-weight:900;font-size:22px;border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums}
.tierbadge{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;color:#0b0b1a;background:var(--aura);border-radius:99px;padding:3px 10px}
.shinytag{position:absolute;left:12px;top:56px;font-size:12px;font-weight:800;color:#ffe66d;background:#000a;border-radius:99px;padding:2px 9px;display:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:8px;height:8px;border-radius:50%}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}

.nameRow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nameRow h2{font-size:22px}
.nameRow span{color:var(--mute);font-size:13px}

.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.cell small{display:block;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.3px}
.cell b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell .sub{font-size:11px;color:var(--mute);margin-top:1px}
.rate b{color:var(--ok)}
.rate.low b{color:var(--warn)}.rate.vlow b{color:var(--bad)}
.rate{grid-column:1/-1}
.rate b small{font-size:12px;color:var(--mute);font-weight:700;margin-left:6px}
.obar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#ffffff14;margin:6px 0 8px}
.obar i{display:block;height:100%}
.fails{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13px}
.fails i{font-style:normal;text-align:center;padding:5px 2px;border-radius:10px;background:#ffffff0d;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:3px solid var(--c)}
.fails i em{display:block;font-style:normal;font-size:11px;color:var(--mute);font-weight:700}
.fails i.z{opacity:.4}

.arm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.arm button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 4px;font-size:12px;font-weight:700;line-height:1.3}
.arm button b{display:block;font-size:11px;color:var(--mute);font-weight:600}
.arm button.on{border-color:var(--gold);background:#ffd23f22}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.btn{border-radius:16px;padding:14px 10px;font-weight:900;font-size:17px;line-height:1.25;transition:transform .08s}
.btn small{display:block;font-weight:700;font-size:12px;opacity:.85}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.enh{background:linear-gradient(180deg,#ffdd55,#f59e0b);color:#2b1c00;box-shadow:0 4px 0 #a16207}
.btn.sell{background:linear-gradient(180deg,#34d399,#059669);color:#052e1f;box-shadow:0 4px 0 #047857}
.btn.work{background:var(--panel2);border:1px solid var(--line);font-size:14px;padding:10px;box-shadow:none;font-weight:700}
.autobox{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.autobox input[type=range]{flex:1;min-width:120px}
.autobox label{display:flex;gap:5px;align-items:center}
.autobox .btn{padding:8px 14px;font-size:14px;box-shadow:none}
.log{list-style:none;margin:0;padding:10px 12px;background:#0007;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:3px;font-size:13px;min-height:130px}
.log li{opacity:.9}.log li:first-child{opacity:1;font-weight:700}
.log li b{font-size:inherit;font-variant-numeric:normal;overflow-wrap:normal}
.log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.log .warn{color:var(--warn)}.log .gold{color:var(--gold)}

/* shop */
.sec{font-size:12px;color:var(--mute);font-weight:800;letter-spacing:.6px;margin-top:4px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item .ic{font-size:28px;text-align:center}
.item h3{font-size:15px}
.item p{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.4}
.item .own{font-size:11px;color:var(--gold);font-weight:700}
.buy{background:linear-gradient(180deg,#ffdd55,#f59e0b);color:#2b1c00;font-weight:800;border-radius:10px;padding:8px 12px;font-size:13px;min-width:92px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.buy.max{background:#ffffff18;color:var(--mute)}
.pips{display:flex;gap:2px;margin-top:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:#ffffff22}.pips i.f{background:var(--gold)}

/* dex */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 2px 8px;text-align:center;min-width:0}
.dx .im{height:62px;display:flex;align-items:flex-end;justify-content:center}
.dx img{image-rendering:pixelated;max-width:56px;max-height:60px}
.dx.lock img{filter:brightness(0) opacity(.5)}
.dx b{display:block;font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx small{font-size:10px;color:var(--mute)}
.dx.cur{box-shadow:0 0 0 2px var(--gold)}
.dx{border-width:2px}

.stats{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{padding:9px 14px;border-bottom:1px solid #ffffff10;font-size:14px;font-variant-numeric:tabular-nums}
.stats div:nth-child(odd){color:var(--mute)}
.stats div:nth-child(even){text-align:right;font-weight:700}
.danger{background:#7f1d1d;border-radius:12px;padding:10px;font-weight:700}
.note{color:var(--mute);font-size:12px;line-height:1.6}
.typeRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--mute);font-weight:700}
.tchip{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:2px 9px;border-radius:99px;text-shadow:0 1px 1px #0006}
.cands{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;line-height:1.4}
.cands b{color:var(--gold)}
.cand{background:#ffffff14;border-radius:99px;padding:2px 10px;font-weight:700}
.cand.real{background:#ffd23f22;color:var(--gold)}
.cands small{flex-basis:100%;color:var(--mute);font-size:11px}
.dexctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dexctl input[type=search],.dexctl select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.dexctl input[type=search]{flex:1;min-width:140px}
.dexctl label{font-size:13px;display:flex;gap:5px;align-items:center}
.trow{display:flex;gap:6px}
.dinfo{background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.dx{cursor:pointer;content-visibility:auto;contain-intrinsic-size:110px}
.dx img{width:56px;height:56px;object-fit:contain}
.ico{image-rendering:pixelated;vertical-align:middle;flex:none}
.item .ic{display:flex;align-items:center;justify-content:center;background:#ffffff0d;border-radius:12px;width:56px;height:56px}
.inv{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1.7}
.inv b{margin-left:auto;color:var(--gold)}
.arm button{display:flex;flex-direction:column;align-items:center;gap:1px}
.btn.store{background:linear-gradient(180deg,#a78bfa,#6d28d9);color:#fff;box-shadow:0 4px 0 #4c1d95;font-size:15px;padding:11px 10px}
.btn.sm{font-size:13px;padding:8px 6px;box-shadow:0 3px 0 #047857}
.abRow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.abRow b{color:#c4b5fd}
.ab{background:#ffffff10;border-radius:10px;padding:3px 9px;font-weight:700;line-height:1.3}
.ab em{font-style:normal;color:#c4b5fd;margin-right:6px}
.abRow small{flex-basis:100%;color:var(--mute);font-size:11px}
.bagsum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bagsum ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700}
.bagsum li{color:var(--ok)}.bagsum li.none{color:var(--mute);font-weight:500}.bagsum li em{color:var(--warn);font-style:normal;font-size:12px}
.bagsum p{margin:4px 0 0}
.legend{margin-top:10px;font-size:12px;color:var(--mute)}
.legend summary{cursor:pointer;font-weight:700;color:#c4b5fd}
.legend ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.legend li{color:var(--mute);font-weight:500;line-height:1.5}.legend li b{color:var(--text);margin-right:6px}
.bag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bagcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bagcard.sh{border-color:#ffe66d}
.bagcard.empty{align-items:center;justify-content:center;color:var(--mute);border-style:dashed;min-height:140px;font-size:13px}
.bh{display:flex;gap:8px;align-items:center}
.bh img{width:56px;height:56px;image-rendering:pixelated;object-fit:contain;flex:none}
.bh b{display:block;font-size:15px}.bh small{color:var(--mute);font-size:12px}
.bp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px;flex:1}
.bp li{background:#ffffff0d;border-radius:8px;padding:4px 8px;line-height:1.35}
.bp .an{display:block;color:#c4b5fd;font-weight:800}
@media(max-width:380px){.bag{grid-template-columns:1fr}}
/* ---------- 메인(타이틀) 화면 ---------- */
body.intro{overflow:hidden}
#title{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:max(18px,env(safe-area-inset-top,0px)) 16px max(22px,env(safe-area-inset-bottom,0px));cursor:pointer;overflow:hidden;
  background:linear-gradient(#2f7fe0,#8fd0ff 55%,#6cc04a);transition:opacity .6s,visibility .6s;user-select:none;-webkit-user-select:none}
#title.hide{opacity:0;visibility:hidden;pointer-events:none}
#title .tbg{position:absolute;inset:-3%;background:url(pokeforge-title.webp) center 42%/cover no-repeat;image-rendering:pixelated;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,1%)}}
@media(orientation:portrait){#title .tbg{background-position:70% 46%}}
#title .tshade{position:absolute;inset:0;background:linear-gradient(180deg,#0a1a5a40 0%,transparent 28%,transparent 55%,#06103a99 100%)}
#title .tlogo{position:relative;margin-top:clamp(28px,10vh,110px);display:flex;flex-direction:column;align-items:center;gap:6px}
#title canvas{image-rendering:pixelated;display:block;max-width:100%}
#logoCv{filter:drop-shadow(0 6px 0 #0a1a5a55)}
#title .tagline{font-family:'DotGothic16','Noto Sans KR',sans-serif;font-size:clamp(11px,2.9vw,15px);letter-spacing:.06em;color:#fff;text-align:center;
  text-shadow:1px 0 #1b1f4b,-1px 0 #1b1f4b,0 1px #1b1f4b,0 -1px #1b1f4b,1px 1px #1b1f4b,-1px -1px #1b1f4b,1px -1px #1b1f4b,-1px 1px #1b1f4b,0 2px #0a1a5a88}
#title .tbot{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
#startCv{animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
#title .tsave{font-family:'DotGothic16','Noto Sans KR',sans-serif;font-size:14px;color:#fff;background:#0a1a5acc;border:2px solid #fff;padding:4px 12px;
  box-shadow:3px 3px 0 #0a1a5a}
#title .tfoot{font-family:'DotGothic16','Noto Sans KR',sans-serif;font-size:11px;color:#dbe8ff;text-shadow:1px 1px 0 #0a1a5a}
.spark{position:absolute;width:4px;height:4px;background:#fff;box-shadow:4px 0 #fff,-4px 0 #fff,0 4px #fff,0 -4px #fff,0 0 8px 2px #fff8;animation:tw 2.2s steps(4,jump-none) infinite}
@keyframes tw{0%,100%{transform:scale(.4);opacity:0}50%{transform:scale(1);opacity:1}}
/* =========================================================
   한 화면 레이아웃
   · 폰 세로: 세로형(위→아래) / 폰 가로·노트북·크롬북: 좌우 2열 가로형
   · 강화 화면은 스크롤 없이 한 화면에 들어오도록 높이를 나눠 쓴다
========================================================= */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden}
#app{max-width:1180px;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  padding-block:8px;gap:8px;overflow:hidden}
.top{display:flex;flex-direction:column;gap:6px;flex:none}
.hud{padding:5px 10px;border-radius:14px;gap:8px}
.gold .coin{font-size:clamp(16px,2.6vh,20px)}
.gold b{font-size:clamp(18px,3.4vh,26px)}
.best{font-size:11px}.best b{font-size:14px}
.iconbtn{padding:4px 9px}
.btn.work{border-radius:10px;padding:4px 10px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;box-shadow:none;min-width:64px}
.btn.work small{font-size:10px;opacity:.9;font-variant-numeric:tabular-nums}
.tabs button{padding:7px 2px;border-radius:10px}
.tab.on{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:4px}
.tab{gap:10px}

/* 강화 화면 */
#tab-main{--fs:clamp(12px,1.7vh,15px);font-size:var(--fs);gap:.5em}
#tab-main.on{display:flex;flex-direction:column;overflow:hidden}
.mleft,.mright{display:contents}
.stage{order:1;flex:1 1 0;min-height:clamp(88px,13vh,190px);height:auto;border-radius:16px}
.strip{order:2;flex:none;display:flex;flex-direction:column;gap:.35em}
.info{order:3;flex:none;display:block}
.info .cell.xx{display:none}
.arm{order:4;flex:none}
.actions{order:5;flex:none}
.autobox{order:6;flex:none}
.log{order:7;flex:none}
.aura{bottom:6%;width:min(78%,360px);aspect-ratio:1;height:auto;left:50%;margin-left:calc(min(78%,360px)/-2)}
.ped{bottom:7%;width:min(60%,260px);height:12%;left:50%;margin-left:calc(min(60%,260px)/-2)}
.monbox{left:0;right:0;top:12%;bottom:14%;height:auto;display:flex;justify-content:center;align-items:flex-end}
.monbox img{height:100%;width:auto;max-width:92%;max-height:none;aspect-ratio:1;object-fit:contain}
.lvbadge{left:8px;top:8px;font-size:1.5em;padding:1px 10px;border-radius:10px}
.tierbadge{right:8px;top:9px;font-size:.85em;padding:2px 9px}
.shinytag{left:8px;top:calc(8px + 2.2em);font-size:.85em}
.plate{position:absolute;left:8px;right:8px;bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}
.plate h2{font-size:1.5em;line-height:1.1;text-shadow:0 2px 4px #000a}
.plate span{display:block;color:#c7d0ff;font-size:.8em;text-shadow:0 1px 3px #000}
.plate .typeRow{justify-content:flex-end;flex-wrap:wrap;gap:4px}
.plate .tchip{font-size:.85em}
.cands,.abRow{padding:.35em .7em;font-size:.95em;gap:.3em .5em;border-radius:10px;line-height:1.3}
.cand{padding:1px .6em}
.ab{padding:1px .6em;border-radius:8px}
.cell.rate{padding:.45em .7em;border-radius:12px}

}

function beep(f,d=.1,type='square',vol=.04,slide=null,delay=0){
  if(muted)return;

    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();

    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

/* ---------- 진화 엔진 ----------
   · 시작 포켓몬의 타입(1~2개)이 이 포켓몬의 '계열'이 된다. 이후 진화는 항상 그 계열 타입을 하나라도 가진 포켓몬으로만 한다.
   · 진화 전→후 관계가 실제로 있으면(피츄→피카츄→라이츄) 후보에 우선 올라온다.
   · 그 밖에는 같은 계열 타입 중 종족값이 한 단계 높은 포켓몬이 후보가 된다. 실제로 진화하는 포켓몬은 후보 중에서 무작위. */
const poolCache={};
function getPool(types){
  const k=types.join();
  if(!poolCache[k]){
    const pool=DEX.filter(d=>d.t.some(t=>types.includes(t))).sort((a,b)=>a.sc-b.sc||a.bst-b.bst||a.id-b.id);
    pool.idx={};pool.forEach((d,i)=>pool.idx[d.id]=i);
    poolCache[k]=pool;
  }
  return poolCache[k];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function candsFor(cur,L,types,hist){
  const pool=getPool(types),used=new Set(hist),out=[],seen=new Set();
  const add=(d,w,r)=>{if(d.id!==cur.id&&!used.has(d.id)&&!seen.has(d.id)){seen.add(d.id);out.push({id:d.id,w,r});}};
  /* 1) 실제 진화(진화 후 포켓몬이 계열 타입을 가진 경우)는 항상 후보에 올라오고 선택 확률이 높다 */
  const ok=d=>L+1>=lateFrom(d);                                            // 등급별 최소 등장 단계
  const okKid=d=>L+1>=Math.max(0,lateFrom(d)-(rarOf(d.id).special?0:5));   // 실제 진화는 일반 등급에 한해 5단계 일찍 허용
  (cur.kids||[]).map(id=>BY[id]).filter(d=>d.t.some(t=>types.includes(t))&&okKid(d)).forEach(d=>add(d,5,1));
  /* 2) 같은 계열 타입 안에서의 '순위'를 남은 단계 수에 맞춰 조금씩 올린다. 30강이면 그 타입의 최상위권에 닿는다 */
  const ci=pool.idx[cur.id],n=pool.length;
  const stepRank=Math.max(1,(n-1-ci)/Math.max(1,MAX-L));
  const reserve=new Set(pool.slice(-8).map(d=>d.id));   // 타입 최상위 8종은 마지막 4단계를 위해 아껴둔다
  const free=d=>!used.has(d.id)&&d.id!==cur.id&&!seen.has(d.id)&&ok(d)&&(L>=MAX-4||!reserve.has(d.id));
  let hi=ci+Math.ceil(stepRank*2),band=[];
  for(let k=0;k<8&&band.length<2;k++,hi+=Math.ceil(stepRank)+1)
    band=pool.filter(d=>pool.idx[d.id]>ci&&pool.idx[d.id]<=hi&&free(d));
  if(band.length<2){   // 이 타입의 최상위에 닿았다: 남은 상위권에서 고른다
    pool.filter(free).slice(-5).forEach(d=>{if(!band.includes(d))band.push(d);});   // 아직 못 만난 포켓몬 중 가장 강한 쪽
  }
  if(L>=MAX-4)band=pool.filter(free).slice(-6);   // 마지막 4단계는 그 타입의 최상위권(아직 못 만난 쪽)에서 나온다
  shuffle(band).slice(0,Math.max(2,4-out.length)).forEach(d=>add(d,1,0));
  if(out.length<2)pool.filter(d=>!used.has(d.id)&&d.id!==cur.id&&!seen.has(d.id)&&ok(d)).slice(-4).forEach(d=>add(d,1,0));
  if(!out.length)pool.filter(d=>!used.has(d.id)&&d.id!==cur.id).slice(-1).forEach(d=>add(d,1,0));   // 극단적인 경우의 안전장치
  return out;
}
function weighted(c){
  let t=0;c.forEach(x=>t+=x.w);let r=Math.random()*t;
  for(const x of c){r-=x.w;if(r<=0)return x;}
  return c[c.length-1];
}

function newMon(startLv){     /* 새 포켓몬 등장 (시작 레벨은 달의돌 레벨만큼) */
  const st=STARTERS[Math.floor(Math.random()*STARTERS.length)];

    if(!c.length)break;

  }
  S.lv=S.hist.length-1;
  S.shiny=Math.random()<shinyChance();
  if(S.shiny)S.stats.shinies++;

  refreshNext();
}

/* 강화 한 번의 결과 확률: 대성공 / 성공 / 유지 / 하락 / 파괴 (합계 1) */
function outcomeProbs(L){
  const pt=PT(),T=rateOf(L)/100,g=(L+2<=MAX)?T*Math.min(.5,GREAT+pt.great/100):0,f=failW(L),q=1-T;
  const k=1-Math.min(.9,pt.keep/100),fd=f[1]*k,fl=f[2]*k;     // 하락·파괴만 줄어들고 그만큼 '유지'가 된다
  return{great:g,succ:T-g,keep:q*(1-fd-fl),drop:q*fd,lost:q*fl};
}

function burst(color,n=26,spread=140){
  const fx=$('#fx'),r=$('#stage').getBoundingClientRect(),cx=r.width/2,cy=r.height*.55;
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='pt';p.style.background=color;p.style.left=cx+'px';p.style.top=cy+'px';
    fx.appendChild(p);
    const a=rnd(0,Math.PI*2),d=rnd(40,spread);
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-30}px) scale(.2)`,opacity:0}],
      {duration:rnd(500,900),easing:'ease-out'}).finished.then(()=>p.remove(),()=>p.remove());
  }
}

let speed=1;
async function enhance(){
  if(busy||S.lv>=MAX)return;
  const L=S.lv,c=costOf(L);
  if(S.gold<c){log('골드가 부족합니다.','warn');return;}
  busy=true;
  const useLucky=S.armed.lucky&&S.inv.lucky>0,useSure=S.armed.sure&&S.inv.sure>0;
  const P=outcomeProbs(L);
  S.gold-=c;S.stats.spent+=c;S.stats.tries++;
  if(useSure){S.inv.sure--;}else if(useLucky){S.inv.lucky--;}
  render();
  /* 충전 연출 */
  SFX.charge();
  const box=$('#monBox');box.classList.add('shake');
  burst(tierOf().c,10,70);
  await sleep(650*speed);
  box.classList.remove('shake');
  const x0=Math.random();
  const res=x0<P.great?'great':x0<P.great+P.succ?'ok':x0<P.great+P.succ+P.keep?'keep':x0<P.great+P.succ+P.keep+P.drop?'drop':'lost';
  const oldName=nameOf(S.hist[L]);
  if(res==='ok'||res==='great'){
    const steps=res==='great'?2:1,names=[];
    for(let i=0;i<steps;i++){
      const pick=weighted(S.next);
      S.hist.push(pick.id);S.lv++;S.dex[pick.id]=1;names.push(`<b>${nameOf(pick.id)}</b>`);
      if(i<steps-1)refreshNext();
    }
    S.stats.ok++;if(res==='great')S.stats.great++;
    let msg=(res==='great'?'★ 대성공! +2단계! ':'성공! ')+`${oldName} → ${names.join(' → ')} (+${S.lv})`;
    if(S.lv>S.best){
      let bonus=0;for(let v=S.best+1;v<=S.lv;v++)bonus+=Math.round(PRICE[v]*.05);
      S.best=S.lv;S.gold+=bonus;
      msg+=` · 첫 달성 보너스 ₽${fmt(bonus)}`;
    }
    refreshNext();
    log(msg,res==='great'?'gold':'ok');
    (S.lv>=20||res==='great')?SFX.big():SFX.ok();
    flash(res==='great'?'#ffd23f':tierOf().c);burst('#ffd23f',res==='great'?80:40,res==='great'?220:170);burst(tierOf().c,20,120);
    renderStage(true);
    await monAnim([{transform:'scale(.3)',filter:'brightness(4)'},{transform:'scale(1.2)',offset:.6},{transform:'scale(1)',filter:'brightness(1)'}],{duration:520*speed,easing:'ease-out'});
  }else{
    S.stats.fail++;
    let out=res;
    let guarded=false;
    if(out!=='keep'&&S.armed.protect&&S.inv.protect>0){S.inv.protect--;out='keep';guarded=true;}
    if(out==='keep'){
      log(guarded?`실패… 하지만 ${jo(oldName,'은')} <b>기합의띠</b>로 버텼다!`:`실패… 변화 없음 (${oldName} +${L})`,guarded?'warn':'');
      SFX.fail();flash('#64748b');burst('#94a3b8',14,90);
      await monAnim([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'none'}],{duration:300});
    }else if(out==='drop'){
      S.stats.drop++;S.hist.pop();S.lv=L-1;refreshNext();
      log(`실패… ${jo(oldName,'이')} 약해졌다. ${nameOf(curId())} (+${S.lv})로 하락`,'bad');
      SFX.drop();flash('#dc2626');burst('#ef4444',22,110);
      renderStage(true);
      await monAnim([{transform:'translateY(-30px) scale(1.1)',opacity:.4},{transform:'none',opacity:1}],{duration:400});
    }else{
      S.stats.lost++;

/* =========================================================
   메인(타이틀) 화면 — 도트 글꼴을 직접 그린다 (5×7 비트맵, 영문 대소문자 일부)
========================================================= */
const GLY={
  P:['####.','#...#','#...#','####.','#....','#....','#....'],
  R:['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],
  E:['#####','#....','#....','####.','#....','#....','#####'],
  S:['.####','#....','#....','.###.','....#','....#','####.'],
  A:['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
  T:['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
  F:['#####','#....','#....','####.','#....','#....','#....'],
  o:['.....','.....','.###.','#...#','#...#','#...#','.###.'],
  k:['#....','#....','#..#.','#.#..','##...','#.#..','#..#.'],
  e:['.....','.....','.###.','#...#','#####','#....','.###.'],
  r:['.....','.....','#.##.','##..#','#....','#....','#....'],
  g:['.....','.....','.###.','#...#','#...#','#...#','.####','....#','.###.'],
  ' ':['...','...','...','...','...','...','...']
};
function pxBitmap(text){
  const H=9,cols=[];
  [...text].forEach((ch,i)=>{
    const g=GLY[ch];const w=g[0].length;
    for(let x=0;x<w;x++){const col=[];for(let y=0;y<H;y++)col.push(g[y]&&g[y][x]==='#'?1:0);cols.push(col);}
    if(i<text.length-1)cols.push(new Array(H).fill(0));
  });
  return {w:cols.length,h:H,at:(x,y)=>x>=0&&y>=0&&x<cols.length&&y<H&&cols[x][y]===1};
}
function drawPx(cv,text,scale,style){
  const bm=pxBitmap(text),pad=3,W=bm.w+pad*2,H=bm.h+pad*2+1;
  cv.width=W*scale;cv.height=H*scale;cv.style.width=cv.width+'px';cv.style.height=cv.height+'px';
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,cv.width,cv.height);
  const R=(x,y,col)=>{c.fillStyle=col;c.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale);};
  const on=(x,y)=>bm.at(x,y);
  const near=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(on(x+dx,y+dy))return true;return false;};
  /* 그림자(아래·오른쪽으로 밀림) → 외곽선(1칸) → 글자 순서로 칠한다 */
  for(let y=-2;y<bm.h+3;y++)for(let x=-2;x<bm.w+3;x++)if(near(x-1,y-2))R(x,y,'rgba(10,26,90,.38)');
  for(let y=-1;y<bm.h+1;y++)for(let x=-1;x<bm.w+1;x++)if(near(x,y))R(x,y,style.outline);
  const rows=style.rows;
  for(let y=0;y<bm.h;y++)for(let x=0;x<bm.w;x++){
    if(!on(x,y))continue;
    let col=rows?rows[Math.min(y,rows.length-1)]:style.fill;
    if(style.bevel){
      if(!on(x,y-1))col=style.hi;
      else if(!on(x,y+1))col=style.lo;
    }
    R(x,y,col);
  }
}
const LOGO_STYLE={outline:'#1b1f4b',bevel:true,hi:'#fff6b8',lo:'#b8450f',
  rows:['#ffe566','#ffe566','#ffd93b','#ffd23b','#ffbf2d','#ffa924','#ff9420','#f07a1a','#e0661a']};

/* ---------- 계정 선물 ----------
   내 계정의 비공개 저장소(data/users/<내 id>/grant)에 선물 문서가 있으면 한 번만 받는다. 다른 사람은 읽을 수 없다. */
async function claimGrant(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('grant');
    const lease=await ref.acquire({holder:'claim-'+Math.random().toString(36).slice(2),ttlMs:8000});   // 탭·기기 동시 수령 방지
    if(!lease.acquired)return;
    const snap=await ref.get();
    if(!snap.exists)return;
    const d=snap.data()||{};
    if(d.claimed||!(d.gold>0))return;
    await ref.update({claimed:true,claimedAt:new Date().toISOString()});
    let already=false;
    try{already=!!localStorage.getItem('pcn_gift_1m');localStorage.removeItem('pcn_gift_1m');}catch(e){}   // 예전 방식으로 이미 받았다면 중복 지급하지 않는다
    if(!already){S.gold+=d.gold;}
    const msg=already?'🎁 선물이 내 계정 지급으로 전환되었습니다.':`🎁 선물 도착! <b>₽ ${fmt(d.gold)}</b>을 받았다.`;
    S.log.unshift({t:msg,c:'gold'});save();render();renderLog();
    const sv=$('#tSave');if(sv){sv.hidden=false;sv.textContent=already?'🎁 선물: 내 계정으로 전환됨':`🎁 선물 도착! +₽ ${fmt(d.gold)}`;}
  }catch(e){}
}

/* =========================================================
   보스전 — 초전설 25종과 싸워 이기면 포획 기회가 1번 생긴다
   파티: 가방 + 지금 포켓몬 중 최대 3마리. 한 라운드마다 태세(전력/균형/방어)를 고른다.
   가방 패시브: 성공 확률→공격력, 대성공 비율→급소 확률, 하락·파괴 완화→받는 피해 감소
========================================================= */
const BOSS_UNLOCK=20, BP=0.5, BA=0.9, BOSS_HP=11.5, CATCH_LV=28;
const TCH={1:{h:[6,9],z:[8]},10:{d:[12,15,7,9],h:[10,11,6,16]},11:{d:[10,5,6],h:[11,12,16]},13:{d:[11,3],h:[13,12,16],z:[5]},
  12:{d:[11,5,6],h:[10,12,4,3,7,16,9]},15:{d:[12,5,3,16],h:[10,11,15,9]},2:{d:[1,15,6,17,9],h:[4,3,14,7,18],z:[8]},
  4:{d:[12,18],h:[4,5,6,8],z:[9]},5:{d:[10,13,4,6,9],h:[12,7],z:[3]},3:{d:[12,2,7],h:[13,6,9]},14:{d:[2,4],h:[14,9],z:[17]},
  7:{d:[12,14,17],h:[10,2,4,3,8,9,18]},6:{d:[10,15,3,7],h:[2,5,9]},8:{d:[14,8],h:[17],z:[1]},16:{d:[16],h:[9],z:[18]},
  17:{d:[14,8],h:[2,17,18]},9:{d:[15,6,18],h:[10,11,13,9]},18:{d:[2,16,17],h:[10,4,9]}};
function tMult(a,defTypes){let m=1;const c=TCH[a]||{};for(const t of defTypes){if(c.z&&c.z.includes(t)){m*=0;continue;}if(c.d&&c.d.includes(t))m*=2;if(c.h&&c.h.includes(t))m*=.5;}return m;}
const bestMult=(atk,def)=>Math.max(.25,...atk.map(a=>tMult(a,def)));
const STANCE={all:{a:1.35,t:1.35},bal:{a:1,t:1},def:{a:.55,t:.45}};
function mkMember(e){
  const d=BY[e.id];
  return{id:e.id,name:d.n,types:d.t,lv:e.lv,shiny:!!e.shiny,atk:d.bst*(.55+e.lv*.025)*(e.shiny?1.1:1),max:Math.round(d.bst*(2.2+e.lv*.06)),hp:Math.round(d.bst*(2.2+e.lv*.06))};
}
function mkBoss(id){const d=BY[id];return{id,name:d.n,types:d.t,atk:d.bst,max:Math.round(d.bst*BOSS_HP),hp:Math.round(d.bst*BOSS_HP),bst:d.bst};}
/* 한 라운드를 계산한다 (화면과 시뮬레이션이 같이 쓴다) */
function bossRound(st,stance,rnd){
  const SC=STANCE[stance],pt=PT(),crit=.06+pt.great/100*1.5,dr=Math.min(.3,pt.keep/200),rb=1+pt.rate/100,ev=[];
  const alive=()=>st.party.filter(m=>m.hp>0);
  let total=0;
  for(const m of alive()){
    const mult=bestMult(m.types,st.boss.types),c=rnd()<crit;
    const dmg=Math.round(m.atk*BP*mult*SC.a*rb*(.9+rnd()*.2)*(c?1.5:1));
    total+=dmg;ev.push({t:'hit',m,dmg,mult,crit:c});
  }
  st.boss.hp=Math.max(0,st.boss.hp-total);
  if(st.boss.hp<=0){ev.push({t:'win'});return ev;}
  const special=st.round%3===0,al=alive();
  const targets=special?al:[al[Math.floor(rnd()*al.length)]];
  for(const m of targets){
    const mult=bestMult(st.boss.types,m.types);
    let dmg=st.boss.atk*BA*mult*SC.t*(1-dr)*(.9+rnd()*.2);if(special)dmg*=.8;
    dmg=Math.round(dmg);m.hp=Math.max(0,m.hp-dmg);ev.push({t:'boss',m,dmg,mult,special});
  }
  if(!alive().length)ev.push({t:'lose'});
  return ev;
}
const caughtIds=()=>S.bag.filter(b=>b.locked).map(b=>b.id);
const bossUnlocked=()=>S.best>=BOSS_UNLOCK;
const arrow=m=>m>1?'<span class="adv up">▲</span>':m<1?'<span class="adv dn">▼</span>':'';

function renderBoss(){
  if(activeTab()!=='tab-boss')return;
  const got=new Set(caughtIds()),ids=[...BOX_LEGEND].sort((a,b)=>a-b);
  const bp=SHOP_ITEMS.find(x=>x.k==='ball').price(),mp=SHOP_ITEMS.find(x=>x.k==='master').price();
  let h=`<div class="bsum"><b>보스전 — 초전설 ${got.size} / ${ids.length}종 포획</b>
    <div class="note">초전설은 강화로 나오지 않습니다. 보스전에서 이긴 뒤 <b>잡을 기회 1번</b>이 주어지고, <b>몬스터볼 10% · 마스터볼 100%</b>입니다. 잡은 초전설은 가방에 영구 보관되며(판매 불가) 강력한 패시브를 줍니다.</div>
    <div class="row"><span>${ico('ball',22)} 몬스터볼 ${S.inv.ball}개 <small class="note">₽ ${fmt(bp)}</small></span><span>${ico('master',22)} 마스터볼 ${S.inv.master}개 <small class="note">₽ ${fmt(mp)}</small></span><span>입장료 ₽ ${fmt(bossFee())}</span></div>
    ${bossUnlocked()?'':`<div class="note" style="color:var(--warn)">🔒 강화 +${BOSS_UNLOCK}을 달성하면 보스전이 열립니다. (최고 기록 +${S.best})</div>`}
  </div><div class="bosslist">`;
  ids.forEach(id=>{
    const d=BY[id],done=got.has(id),lock=!bossUnlocked();
    h+=`<div class="bc${done?' done':''}${lock?' lock':''}" data-boss="${id}"><img data-id="${id}" alt=""><b>${d.n}</b><div class="tp">${typeChips(d.t)}</div><small>종족값 ${d.bst}</small><small>${done?'✔ 포획 완료':lock?'잠김':'도전 가능'}</small></div>`;
  });
  h+='</div>';
  $('#tab-boss').innerHTML=h;
  $('#tab-boss').querySelectorAll('img[data-id]').forEach(im=>chain(im,+im.dataset.id));
}

let BS=null,bBusy=false;
function bossOpen(id){
  if(!bossUnlocked()||caughtIds().includes(id))return;
  BS={id,boss:mkBoss(id),sel:[],view:'party',round:1,party:[],log:[]};
  $('#boss').hidden=false;document.body.style.overflow='hidden';renderBossView();
}
function bossClose(){
  if(bBusy)return;
  $('#boss').hidden=true;document.body.style.overflow='';BS=null;save();render();
}
function candidates(){   // 출전 후보: 지금 포켓몬 + 가방
  const l=[{id:curId(),lv:S.lv,shiny:S.shiny,src:'now'}];
  S.bag.forEach((b,i)=>l.push({id:b.id,lv:b.lv,shiny:b.shiny,src:'bag'+i}));
  return l;
}
function renderBossView(){
  const body=$('#bBody');if(!BS)return;
  const b=BS.boss,bd=BY[b.id],rc=rarOf(b.id);
  $('#boss').style.setProperty('--bc',rc.c);
  if(BS.view==='party'){
    $('#bTitle').textContent='보스전 — 출전 포켓몬 선택';body.className='';
    const cs=candidates(),ok=BS.sel.length>0&&S.gold>=bossFee()&&S.bag.length<slots();
    let h=`<div class="bsum"><b>${bd.n} <span class="chip" style="background:${rc.bg||rc.c};color:#1b1f4b;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800">${rc.n}</span></b>
      <div class="row"><span>${typeChips(bd.t)}</span><span>종족값 ${bd.bst}</span><span>입장료 ₽ ${fmt(bossFee())}</span></div>
      <div class="note">3마리까지 고르세요. ▲는 보스에게 유리한 타입, ▼는 불리한 타입입니다. 질 때는 입장료만 잃습니다.${S.bag.length>=slots()?' <b style="color:var(--warn)">가방에 빈 칸이 있어야 도전할 수 있습니다.</b>':''}</div></div>
      <div class="bplist">`;
    cs.forEach((c,i)=>{
      const m=mkMember(c),mult=bestMult(m.types,b.types),sel=BS.sel.includes(i);
      h+=`<div class="pc${sel?' sel':''}" data-pc="${i}"><img data-id="${c.id}" alt=""><div><b>${c.shiny?'✨ ':''}${nameOf(c.id)}${c.src==='now'?' <small>(지금)</small>':''}</b><small>+${c.lv} · <span style="color:${rarOf(c.id).c}">${rarOf(c.id).n}</span></small><small>공격 ${Math.round(m.atk)} ${arrow(mult)} · 체력 ${m.max}</small></div></div>`;
    });
    h+=`</div><div class="actions" style="grid-template-columns:1fr 1.4fr;flex:none"><button class="btn sm" id="bAuto" style="background:var(--panel2)">추천 3마리 자동 선택</button>
      <button class="btn enh" id="bStart" ${ok?'':'disabled'}>전투 시작<small>₽ ${fmt(bossFee())} · ${BS.sel.length}/3마리</small></button></div>`;
    body.innerHTML=h;
    body.querySelectorAll('img[data-id]').forEach(im=>chain(im,+im.dataset.id));
    return;
  }
  if(BS.view==='battle'){
    $('#bTitle').textContent=`보스전 — 라운드 ${BS.round}`;body.className='battle';
    const special=BS.round%3===0;
    body.innerHTML=`<div class="bt-boss"><div class="bimg"><img id="bImg" data-id="${b.id}" alt=""></div>
        <div class="nm"><h2>${bd.n}</h2>${typeChips(bd.t)}</div><div class="bhp"><i id="bHp" style="width:${b.hp/b.max*100}%"></i></div>
        <div class="bwarn" id="bWarn">${special?'⚠ 보스가 힘을 모으고 있다! 이번 라운드는 전체 공격!':''}</div></div>
      <div class="bt-side"><div class="bparty" id="bParty"></div>
        <div class="stances"><button class="st-all" data-st="all">전력 공격<small>공격 ×1.35 · 피해 ×1.35</small></button><button class="st-bal" data-st="bal">균형<small>기본</small></button><button class="st-def" data-st="def">방어 태세<small>공격 ×0.55 · 피해 ×0.45</small></button></div>
        <ul class="log" id="bLog"></ul></div>`;
    chain($('#bImg'),b.id);renderParty();renderBLog();return;
  }
  if(BS.view==='catch'){
    $('#bTitle').textContent='보스전 — 승리! 포획 기회 1번';body.className='';
    const bp=SHOP_ITEMS.find(x=>x.k==='ball').price(),mp=SHOP_ITEMS.find(x=>x.k==='master').price();
    body.innerHTML=`<div class="bsum" style="align-items:center;text-align:center"><div class="bimg" style="height:140px"><img id="bImg" data-id="${b.id}" alt="" style="height:140px;image-rendering:pixelated;filter:drop-shadow(0 0 12px ${rc.c})"></div>
      <b style="font-size:18px">${bd.n}</b><div class="note">${BS.msg||'쓰러뜨렸다! 볼을 던져 잡아 보자. 기회는 단 한 번이다.'}</div></div>
      <div class="ballbtns"><button class="btn enh" id="bBall" ${S.inv.ball>0&&!BS.done?'':'disabled'}>${ico('ball',28)}몬스터볼 던지기<small>보유 ${S.inv.ball}개 · 확률 10%</small></button>
      <button class="btn store" id="bMaster" ${S.inv.master>0&&!BS.done?'':'disabled'}>${ico('master',28)}마스터볼 던지기<small>보유 ${S.inv.master}개 · 확률 100%</small></button></div>
      ${BS.done?'':`<div class="ballbtns"><button class="btn sm" id="bBuyBall" style="background:var(--panel2)" ${S.gold>=bp?'':'disabled'}>몬스터볼 구매 ₽ ${fmt(bp)}</button><button class="btn sm" id="bBuyMaster" style="background:var(--panel2)" ${S.gold>=mp?'':'disabled'}>마스터볼 구매 ₽ ${fmt(mp)}</button></div>`}
      <button class="btn sm" id="bGive" style="background:var(--panel2)">${BS.done?'닫기':'포기하고 돌아가기'}</button>`;
    chain($('#bImg'),b.id);return;
  }
  if(BS.view==='lose'){
    $('#bTitle').textContent='보스전 — 패배';body.className='';
    body.innerHTML=`<div class="bsum" style="align-items:center;text-align:center"><b style="font-size:20px">눈앞이 깜깜해졌다…</b><div class="note">${bd.n}에게 졌다. 입장료 ₽ ${fmt(bossFee())}을 잃었다. 파티를 다시 짜서 도전해 보자.</div></div>
      <div class="actions" style="grid-template-columns:1fr 1fr;flex:none"><button class="btn enh" id="bRetry">다시 도전</button><button class="btn sm" id="bGive" style="background:var(--panel2)">돌아가기</button></div>`;
  }
}
function renderParty(){
  const el=$('#bParty');if(!el)return;
  el.innerHTML=BS.party.map(m=>`<div class="pm${m.hp<=0?' ko':''}"><img data-id="${m.id}" alt=""><b>${m.name}</b><div class="mhp"><i style="width:${m.hp/m.max*100}%"></i></div><small>${m.hp}/${m.max}</small></div>`).join('');
  el.querySelectorAll('img[data-id]').forEach(im=>chain(im,+im.dataset.id));
}
function renderBLog(){const el=$('#bLog');if(el)el.innerHTML=BS.log.slice(0,3).map(t=>`<li>${t}</li>`).join('');}
function blog(t){BS.log.unshift(t);renderBLog();}

function bossStart(){
  if(S.gold<bossFee()||!BS.sel.length||S.bag.length>=slots())return;
  S.gold-=bossFee();S.stats.boss++;S.stats.spent+=bossFee();
  const cs=candidates();
  BS.party=BS.sel.map(i=>mkMember(cs[i]));BS.boss=mkBoss(BS.id);BS.round=1;BS.log=['⚔ 보스전 시작!'];BS.view='battle';
  save();render();SFX.charge();renderBossView();
}
async function bossAct(stance){
  if(bBusy||!BS||BS.view!=='battle')return;
  bBusy=true;
  const ev=bossRound(BS,stance,Math.random);
  const bImg=$('#bImg');
  let won=false,lost=false;
  for(const e of ev){
    if(e.t==='hit'){
      blog(`${e.m.name}의 공격! ${e.dmg.toLocaleString()} 피해${e.mult>1?' (효과 굉장!)':e.mult<1?' (별로…)':''}${e.crit?' 급소!':''}`);
      if(bImg)bImg.animate([{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(-8px)',filter:'brightness(2.2)'},{transform:'translateX(6px)'},{transform:'none',filter:'brightness(1)'}],{duration:260});
      beep(220,.08,'sawtooth',.04,80);
      await sleep(260);
    }else if(e.t==='boss'){
      blog(`${BS.boss.name}의 ${e.special?'전체 공격':'공격'}! ${e.m.name}에게 ${e.dmg.toLocaleString()} 피해${e.m.hp<=0?' — 쓰러졌다!':''}`);
      beep(e.special?120:180,.14,'square',.05,60);
      await sleep(320);
    }else if(e.t==='win')won=true;else if(e.t==='lose')lost=true;
    const hpEl=$('#bHp');if(hpEl)hpEl.style.width=(BS.boss.hp/BS.boss.max*100)+'%';
    renderParty();
  }
  await sleep(300);
  if(won){S.stats.bossWin++;SFX.big();BS.view='catch';BS.msg='';save();bBusy=false;renderBossView();return;}
  if(lost){SFX.fail();BS.view='lose';bBusy=false;renderBossView();return;}
  BS.round++;bBusy=false;renderBossView();
}
function bossCatch(kind){
  if(!BS||BS.done||S.inv[kind]<=0)return;
  if(S.bag.length>=slots()){BS.msg='가방에 빈 칸이 없어 잡을 수 없다. 포기하고 가방을 정리한 뒤 다시 도전하자.';renderBossView();return;}
  S.inv[kind]--;BS.done=true;
  const ok=Math.random()<BALL_RATE[kind];
  if(ok){
    S.bag.push({id:BS.id,lv:CATCH_LV,shiny:false,locked:true});S.dex[BS.id]=1;S.stats.stored++;
    BS.msg=`🎉 신난다! <b>${BS.boss.name}</b>을(를) 잡았다! 가방에 영구 보관됩니다. (+${CATCH_LV} 효과)`;
    log(`🎉 보스전 승리! <b>${BS.boss.name}</b> 포획 성공!`,'gold');SFX.big();
  }else{
    BS.msg=`${kind==='master'?'마스터볼도':'볼이'} 빠져나왔다… ${BS.boss.name}은(는) 도망쳤다. 기회는 끝났다.`;
    log(`${BS.boss.name}을(를) 놓쳤다…`,'bad');SFX.boom();
  }
  save();render();renderBossView();
}
function bossBuy(kind){
  const it=SHOP_ITEMS.find(x=>x.k===kind),p=it.price();
  if(S.gold<p)return;S.gold-=p;S.inv[kind]++;SFX.buy();save();render();renderBossView();
}
$('#bClose').onclick=bossClose;
$('#tab-boss').onclick=e=>{const c=e.target.closest('[data-boss]');if(c)bossOpen(+c.dataset.boss);};
$('#bBody').onclick=e=>{
  const t=e.target.closest('button,[data-pc]');if(!t||!BS)return;
  if(t.dataset.pc!==undefined){
    const i=+t.dataset.pc,at=BS.sel.indexOf(i);
    if(at>=0)BS.sel.splice(at,1);else if(BS.sel.length<3)BS.sel.push(i);
    SFX.click();renderBossView();return;
  }
  if(t.id==='bAuto'){
    const cs=candidates(),b=BS.boss;
    BS.sel=cs.map((c,i)=>{const m=mkMember(c);return{i,v:m.atk*bestMult(m.types,b.types)+m.max*.15};}).sort((x,y)=>y.v-x.v).slice(0,3).map(x=>x.i);
    SFX.click();renderBossView();return;
  }
  if(t.id==='bStart')return bossStart();
  if(t.dataset.st)return bossAct(t.dataset.st);
  if(t.id==='bBall')return bossCatch('ball');
  if(t.id==='bMaster')return bossCatch('master');
  if(t.id==='bBuyBall')return bossBuy('ball');
  if(t.id==='bBuyMaster')return bossBuy('master');
  if(t.id==='bGive')return bossClose();
  if(t.id==='bRetry'){BS.view='party';BS.boss=mkBoss(BS.id);BS.round=1;renderBossView();return;}
};

/* 시작 */
load();

if(!(S.hist.length&&S.lv===S.hist.length-1&&S.hist.every(id=>BY[id])&&S.types.length)){newMon();}
S.hist.forEach(id=>S.dex[id]=1);
if(!S.next||!S.next.length||!S.next.every(c=>BY[c.id]))refreshNext();
$('#autoRange').value=S.auto.target;$('#autoSell').checked=S.auto.sell;
renderLog();render();loadSprites();initTitle();claimGrant();
</script>
</body>
