<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포켓몬 강화왕</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0c0f24; --bg2:#151a3c; --panel:#1a2048; --panel2:#232b5e; --line:#37408a;
  --text:#eef0ff; --mute:#9aa3d6; --gold:#ffd23f; --ok:#4ade80; --bad:#f87171; --warn:#fb923c;
  --aura:#9aa6c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 50% -10%,#3a3f9a55,transparent),radial-gradient(700px 500px at 100% 100%,#c2410c33,transparent),var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
h2,h3{margin:0}
#app{max-width:560px;margin:0 auto;padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;position:relative}
.gold{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.gold .coin{color:var(--gold);font-weight:900;font-size:20px}
.gold b{font-size:clamp(20px,6vw,28px);font-variant-numeric:tabular-nums;color:var(--gold);overflow-wrap:anywhere}
.best{font-size:12px;color:var(--mute);text-align:right;line-height:1.3}
.best b{color:var(--text);font-size:15px}
.iconbtn{background:#ffffff14;border-radius:10px;padding:6px 10px}
.float{position:absolute;left:44px;top:100%;margin-top:-4px;font-weight:800;font-size:18px;pointer-events:none;font-variant-numeric:tabular-nums;z-index:5;text-shadow:0 2px 6px #000}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button.on{background:linear-gradient(180deg,#ffd23f,#f59e0b);color:#2b1c00;border-color:#ffd23f}
.tab{display:none;flex-direction:column;gap:12px}
.tab.on{display:flex}

/* stage */
.stage{position:relative;height:310px;border-radius:20px;border:2px solid var(--line);overflow:hidden;
  background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--aura) 40%,transparent),transparent 55%),linear-gradient(180deg,#1b2155,#10143a)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 36px),repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 36px)}
.ped{position:absolute;left:50%;bottom:34px;width:230px;height:54px;margin-left:-115px;border-radius:50%;
  background:radial-gradient(ellipse,color-mix(in srgb,var(--aura) 70%,#fff) 0,var(--aura) 35%,transparent 70%);opacity:.55;filter:blur(1px)}
.aura{position:absolute;left:50%;bottom:50px;width:250px;height:250px;margin-left:-125px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--aura) 55%,transparent),transparent 68%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.monbox{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;align-items:flex-end;height:230px}
.monbox img{image-rendering:pixelated;max-width:260px;max-height:230px;filter:drop-shadow(0 8px 6px #0007);animation:bob 2.2s ease-in-out infinite}
.monbox img.shiny{filter:hue-rotate(150deg) saturate(1.4) drop-shadow(0 0 10px #ffe66d)}
@keyframes bob{50%{transform:translateY(-8px)}}
.lvbadge{position:absolute;left:12px;top:10px;background:#000a;border:2px solid var(--aura);color:#fff;font-weight:900;font-size:22px;border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums}
.tierbadge{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;color:#0b0b1a;background:var(--aura);border-radius:99px;padding:3px 10px}
.shinytag{position:absolute;left:12px;top:56px;font-size:12px;font-weight:800;color:#ffe66d;background:#000a;border-radius:99px;padding:2px 9px;display:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:8px;height:8px;border-radius:50%}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}

.nameRow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nameRow h2{font-size:22px}
.nameRow span{color:var(--mute);font-size:13px}

.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.cell small{display:block;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.3px}
.cell b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell .sub{font-size:11px;color:var(--mute);margin-top:1px}
.rate b{color:var(--ok)}
.rate.low b{color:var(--warn)}.rate.vlow b{color:var(--bad)}
.fails{display:flex;gap:6px;font-size:12px;margin-top:2px;flex-wrap:wrap}
.fails i{font-style:normal;padding:1px 7px;border-radius:99px;background:#ffffff12}
.fails .d{color:var(--warn)}.fails .x{color:var(--bad)}

.arm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.arm button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 4px;font-size:12px;font-weight:700;line-height:1.3}
.arm button b{display:block;font-size:11px;color:var(--mute);font-weight:600}
.arm button.on{border-color:var(--gold);background:#ffd23f22}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.btn{border-radius:16px;padding:14px 10px;font-weight:900;font-size:17px;line-height:1.25;transition:transform .08s}
.btn small{display:block;font-weight:700;font-size:12px;opacity:.85}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.enh{background:linear-gradient(180deg,#ffdd55,#f59e0b);color:#2b1c00;box-shadow:0 4px 0 #a16207}
.btn.sell{background:linear-gradient(180deg,#34d399,#059669);color:#052e1f;box-shadow:0 4px 0 #047857}
.btn.work{background:var(--panel2);border:1px solid var(--line);font-size:14px;padding:10px;box-shadow:none;font-weight:700}
.autobox{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.autobox input[type=range]{flex:1;min-width:120px}
.autobox label{display:flex;gap:5px;align-items:center}
.autobox .btn{padding:8px 14px;font-size:14px;box-shadow:none}
.log{list-style:none;margin:0;padding:10px 12px;background:#0007;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:3px;font-size:13px;min-height:130px}
.log li{opacity:.9}.log li:first-child{opacity:1;font-weight:700}
.log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.log .warn{color:var(--warn)}.log .gold{color:var(--gold)}

/* shop */
.sec{font-size:12px;color:var(--mute);font-weight:800;letter-spacing:.6px;margin-top:4px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item .ic{font-size:28px;text-align:center}
.item h3{font-size:15px}
.item p{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.4}
.item .own{font-size:11px;color:var(--gold);font-weight:700}
.buy{background:linear-gradient(180deg,#ffdd55,#f59e0b);color:#2b1c00;font-weight:800;border-radius:10px;padding:8px 12px;font-size:13px;min-width:92px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.buy.max{background:#ffffff18;color:var(--mute)}
.pips{display:flex;gap:2px;margin-top:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:#ffffff22}.pips i.f{background:var(--gold)}

/* dex */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 2px 8px;text-align:center;min-width:0}
.dx .im{height:62px;display:flex;align-items:flex-end;justify-content:center}
.dx img{image-rendering:pixelated;max-width:56px;max-height:60px}
.dx.lock img{filter:brightness(0) opacity(.5)}
.dx b{display:block;font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx small{font-size:10px;color:var(--mute)}
.dx.cur{border-color:var(--gold)}

.stats{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{padding:9px 14px;border-bottom:1px solid #ffffff10;font-size:14px;font-variant-numeric:tabular-nums}
.stats div:nth-child(odd){color:var(--mute)}
.stats div:nth-child(even){text-align:right;font-weight:700}
.danger{background:#7f1d1d;border-radius:12px;padding:10px;font-weight:700}
.note{color:var(--mute);font-size:12px;line-height:1.6}
.typeRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--mute);font-weight:700}
.tchip{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:2px 9px;border-radius:99px;text-shadow:0 1px 1px #0006}
.cands{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;line-height:1.4}
.cands b{color:var(--gold)}
.cand{background:#ffffff14;border-radius:99px;padding:2px 10px;font-weight:700}
.cand.real{background:#ffd23f22;color:var(--gold)}
.cands small{flex-basis:100%;color:var(--mute);font-size:11px}
.dexctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dexctl input[type=search],.dexctl select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.dexctl input[type=search]{flex:1;min-width:140px}
.dexctl label{font-size:13px;display:flex;gap:5px;align-items:center}
.trow{display:flex;gap:6px}
.dinfo{background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.dx{cursor:pointer;content-visibility:auto;contain-intrinsic-size:110px}
.dx img{width:56px;height:56px;object-fit:contain}
.ico{image-rendering:pixelated;vertical-align:middle;flex:none}
.item .ic{display:flex;align-items:center;justify-content:center;background:#ffffff0d;border-radius:12px;width:56px;height:56px}
.inv{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1.7}
.inv b{margin-left:auto;color:var(--gold)}
.arm button{display:flex;flex-direction:column;align-items:center;gap:1px}
@media(max-width:380px){.dex{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="gold"><span class="coin">₽</span><b id="gold">0</b></div>
    <div class="best">최고 기록<br><b>+<span id="best">0</span></b></div>
    <button class="iconbtn" id="btnSound" aria-label="소리">🔊</button>
    <span class="float" id="gfloat"></span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="main" class="on">강화</button>
    <button data-t="shop">상점</button>
    <button data-t="dex">도감</button>
    <button data-t="stats">기록</button>
  </nav>

  <!-- 강화 -->
  <section class="tab on" id="tab-main">
    <div class="stage" id="stage">
      <div class="aura"></div><div class="ped"></div>
      <div class="lvbadge" id="lvBadge">+0</div>
      <div class="tierbadge" id="tierBadge">일반</div>
      <div class="shinytag" id="shinyTag">✨ 이로치 ×2.5</div>
      <div class="monbox" id="monBox"><img id="mon" alt=""></div>
      <div id="fx"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="nameRow"><h2 id="monName">-</h2><span id="nextName"></span></div>
    <div class="typeRow" id="typeRow"></div>
    <div class="cands" id="candRow"></div>
    <div class="info">
      <div class="cell rate" id="rateCell"><small>성공 확률</small><b id="rate">-</b>
        <div class="fails" id="fails"></div></div>
      <div class="cell"><small>강화 비용</small><b id="cost">-</b><div class="sub" id="costSub"></div></div>
      <div class="cell"><small>판매가</small><b id="price" style="color:var(--gold)">-</b><div class="sub" id="priceSub"></div></div>
      <div class="cell"><small>보유 아이템</small><div id="invText" style="font-size:13px;font-weight:700;line-height:1.5">-</div></div>
    </div>
    <div class="arm" id="arm"></div>
    <div class="actions">
      <button class="btn enh" id="btnEnh">강화하기<small id="enhSub"></small></button>
      <button class="btn sell" id="btnSell">판매하기<small id="sellSub"></small></button>
    </div>
    <div class="autobox" id="autoBox" hidden>
      <b>자동 강화</b>
      <label>목표 +<span id="autoT">10</span></label>
      <input type="range" id="autoRange" min="1" max="30" value="10">
      <label><input type="checkbox" id="autoSell" checked> 도달하면 판매</label>
      <button class="btn enh" id="btnAuto">시작</button>
    </div>
    <button class="btn work" id="btnWork">포켓몬 센터 심부름 <small id="workSub"></small></button>
    <ul class="log" id="log"></ul>
  </section>

  <!-- 상점 -->
  <section class="tab" id="tab-shop"></section>

  <!-- 도감 -->
  <section class="tab" id="tab-dex"></section>

  <!-- 기록 -->
  <section class="tab" id="tab-stats"></section>
</div>

function failW(L){                      // [유지, 하락, 파괴]
  if(L<8)return[1,0,0];
  if(L<15)return[.6,.4,0];

const COST_BASE=15,COST_G=1.36;
const baseCost=L=>COST_BASE*Math.pow(COST_G,L);

/* 레벨 T까지 가는 평균 비용(파괴 시 처음부터)을 풀어서 판매가의 기준으로 삼는다 */
function expectedCost(T){
  const n=T,A=[...Array(n)].map(()=>Array(n+1).fill(0));
  for(let L=0;L<n;L++){
    const p=RATE[L]/100,[k,d,x]=failW(L),q=1-p;
    A[L][L]+=1;A[L][n]=baseCost(L);
    if(L+1<n)A[L][L+1]-=p;
    A[L][L]-=q*k;
    if(L>0)A[L][L-1]-=q*d;
    A[L][0]-=q*x;
  }
  for(let i=0;i<n;i++){
    let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];
    for(let r=0;r<n;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<=n;c++)A[r][c]-=f*A[i][c];}
  }
  return A[0][n]/A[0][0];
}

function fmt(n){
  n=Math.floor(n);
  if(n<10000)return n.toLocaleString('ko-KR');
  const U=['','만','억','조','경'];const parts=[];
  let i=0;while(n>0){parts.push(n%10000);n=Math.floor(n/10000);i++;}
  let out='',shown=0;
  for(let k=parts.length-1;k>=0&&shown<2;k--){
    if(parts[k]===0&&shown===0)continue;
    if(parts[k]>0){out+=(out?' ':'')+parts[k].toLocaleString('ko-KR')+U[k];shown++;}
  }
  return out;
}

let muted=false,AC=null;
function beep(f,d=.1,type='square',vol=.04,slide=null,delay=0){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

/* ---------- 진화 엔진 ----------
   · 시작 포켓몬의 타입(1~2개)이 이 포켓몬의 '계열'이 된다. 이후 진화는 항상 그 계열 타입을 하나라도 가진 포켓몬으로만 한다.
   · 진화 전→후 관계가 실제로 있으면(피츄→피카츄→라이츄) 후보에 우선 올라온다.
   · 그 밖에는 같은 계열 타입 중 종족값이 한 단계 높은 포켓몬이 후보가 된다. 실제로 진화하는 포켓몬은 후보 중에서 무작위. */
const poolCache={};
function getPool(types){
  const k=types.join();
  if(!poolCache[k]){
    const pool=DEX.filter(d=>d.t.some(t=>types.includes(t))).sort((a,b)=>a.bst-b.bst||a.id-b.id);
    pool.idx={};pool.forEach((d,i)=>pool.idx[d.id]=i);
    poolCache[k]=pool;
  }
  return poolCache[k];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function candsFor(cur,L,types,hist){
  const pool=getPool(types),used=new Set(hist),out=[],seen=new Set();
  const add=(d,w,r)=>{if(d.id!==cur.id&&!used.has(d.id)&&!seen.has(d.id)){seen.add(d.id);out.push({id:d.id,w,r});}};
  /* 1) 실제 진화(진화 후 포켓몬이 계열 타입을 가진 경우)는 항상 후보에 올라오고 선택 확률이 높다 */
  (cur.kids||[]).map(id=>BY[id]).filter(d=>d.t.some(t=>types.includes(t))).forEach(d=>add(d,5,1));
  /* 2) 같은 계열 타입 안에서의 '순위'를 남은 단계 수에 맞춰 조금씩 올린다. 30강이면 그 타입의 최상위권에 닿는다 */
  const ci=pool.idx[cur.id],n=pool.length;
  const stepRank=Math.max(1,(n-1-ci)/Math.max(1,MAX-L));
  const reserve=new Set(pool.slice(-8).map(d=>d.id));   // 타입 최상위 8종은 마지막 4단계를 위해 아껴둔다
  const free=d=>!used.has(d.id)&&d.id!==cur.id&&!seen.has(d.id)&&(L>=MAX-4||!reserve.has(d.id));
  let hi=ci+Math.ceil(stepRank*2),band=[];
  for(let k=0;k<8&&band.length<2;k++,hi+=Math.ceil(stepRank)+1)
    band=pool.filter(d=>pool.idx[d.id]>ci&&pool.idx[d.id]<=hi&&free(d));
  if(band.length<2){   // 이 타입의 최상위에 닿았다: 남은 상위권에서 고른다
    pool.filter(free).slice(-5).forEach(d=>{if(!band.includes(d))band.push(d);});   // 아직 못 만난 포켓몬 중 가장 강한 쪽
  }
  if(L>=MAX-4)band=pool.filter(free).slice(-6);   // 마지막 4단계는 그 타입의 최상위권(아직 못 만난 쪽)에서 나온다
  shuffle(band).slice(0,Math.max(2,4-out.length)).forEach(d=>add(d,1,0));
  if(out.length<2)pool.filter(d=>!used.has(d.id)&&d.id!==cur.id&&!seen.has(d.id)).slice(-4).forEach(d=>add(d,1,0));
  return out;
}
function weighted(c){
  let t=0;c.forEach(x=>t+=x.w);let r=Math.random()*t;
  for(const x of c){r-=x.w;if(r<=0)return x;}
  return c[c.length-1];
}
const curId=()=>S.hist[S.lv];
const curMon=()=>BY[curId()];
function refreshNext(){
  S.next=S.lv<MAX?candsFor(curMon(),S.lv,S.types,S.hist):[];
}
function newMon(startLv){     /* 새 포켓몬 등장 (시작 레벨은 달의돌 레벨만큼) */
  const st=STARTERS[Math.floor(Math.random()*STARTERS.length)];
  S.types=st.t.slice();S.hist=[st.id];
  const n=startLv===undefined?S.up.start:startLv;
  for(let i=1;i<=n;i++){
    const c=candsFor(BY[S.hist[i-1]],i-1,S.types,S.hist);
    if(!c.length)break;
    S.hist.push(weighted(c).id);
  }
  S.lv=S.hist.length-1;
  S.shiny=Math.random()<shinyChance();
  if(S.shiny)S.stats.shinies++;
  S.hist.forEach(id=>S.dex[id]=1);
  refreshNext();
}

  if(activeTab()!=='tab-shop')return;
  const el=$('#tab-shop');
  let h='<div class="sec">도구 (1회용)</div>';
  SHOP_ITEMS.forEach(it=>{const p=it.price();
    h+=`<div class="item"><div class="ic">${ico(it.ic,44)}</div><div><h3>${it.n}</h3><p>${it.d}</p><div class="own">보유 ${S.inv[it.k]}개</div></div>
      <button class="buy" data-buy="${it.k}" ${S.gold<p?'disabled':''}>₽ ${fmt(p)}</button></div>`;});
  h+='<div class="sec">지닌 물건 (영구)</div>';
  Object.entries(UPS).forEach(([k,u])=>{
    const lv=S.up[k],mx=lv>=u.max,p=upCost(k,lv);
    h+=`<div class="item"><div class="ic">${ico(u.ic,44)}</div><div><h3>${u.n} <span class="own">Lv.${lv}/${u.max}</span></h3><p>${u.d}</p>
      <div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'f':''}"></i>`).join('')}</div></div>
      <button class="buy${mx?' max':''}" data-up="${k}" ${mx||S.gold<p?'disabled':''}>${mx?'MAX':'₽ '+fmt(p)}</button></div>`;});
  h+='<div class="sec">기기</div>';
  h+=`<div class="item"><div class="ic">${ico('auto',44)}</div><div><h3>학습장치 ${S.autoUnlocked?'<span class="own">해금됨</span>':''}</h3><p>자동 강화 기능이 들어 있다. 목표 레벨까지 알아서 강화하고, 도달하면 판매까지 반복한다.</p></div>
      <button class="buy${S.autoUnlocked?' max':''}" data-auto="1" ${S.autoUnlocked||S.gold<AUTO_PRICE?'disabled':''}>${S.autoUnlocked?'보유':'₽ '+fmt(AUTO_PRICE)}</button></div>`;
  el.innerHTML=h;
}
let dexSel=0;
const dexIO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){dexIO.unobserve(e.target);chain(e.target,+e.target.dataset.id);}
}),{rootMargin:'300px'}):null;
function dexBuilt(){return !!$('#dexList');}
function renderDex(){
  if(activeTab()!=='tab-dex')return;
  if(!dexBuilt()){
    $('#tab-dex').innerHTML=`<div class="note" id="dexSum"></div>
      <div class="dexctl"><input id="dexQ" type="search" placeholder="이름 또는 번호 검색" autocomplete="off">
      <select id="dexT"><option value="0">모든 타입</option>${TYPE_KO.map((n,i)=>i?`<option value="${i}">${n}</option>`:'').join('')}</select>
      <label><input type="checkbox" id="dexOnly"> 발견만</label></div>
      <div id="dexInfo"></div><div class="dex" id="dexList"></div>`;
    ['#dexQ','#dexT','#dexOnly'].forEach(q=>$(q).addEventListener('input',buildDexList));
    $('#dexList').addEventListener('click',e=>{const d=e.target.closest('.dx');if(!d)return;dexSel=+d.dataset.id;dexInfo();});
  }
  buildDexList();
}
function dexInfo(){
  const el=$('#dexInfo');if(!el)return;
  const d=BY[dexSel];
  if(!d||!S.dex[d.id]){el.innerHTML=d?'<div class="note">아직 만나지 못한 포켓몬입니다. 강화로 진화시켜 발견해 보세요.</div>':'';return;}
  const pre=d.par?BY[d.par]:null,kids=(d.kids||[]).map(i=>BY[i]);
  el.innerHTML=`<div class="dinfo"><b>#${String(d.id).padStart(4,'0')} ${d.n}</b><div class="trow">${typeChips(d.t)}</div>
    <div class="note">종족값 합계 ${d.bst}${d.fl?` · ${d.fl===1?'전설':'환상'}의 포켓몬`:''}<br>
    진화: ${pre?pre.n:'(없음)'} → <b>${d.n}</b> → ${kids.length?kids.map(k=>k.n).join(' / '):'(없음)'}</div></div>`;
}
function buildDexList(){
  const q=$('#dexQ').value.trim(),tp=+$('#dexT').value,only=$('#dexOnly').checked;
  const found=Object.keys(S.dex).length;
  $('#dexSum').innerHTML=`발견한 포켓몬 <b style="color:var(--gold)">${found}</b> / ${DEX.length} (${Math.round(found/DEX.length*1000)/10}%) · 이로치 ${S.stats.shinies}마리 만남`;
  const list=DEX.filter(d=>{
    if(tp&&!d.t.includes(tp))return false;
    const ok=S.dex[d.id];
    if(only&&!ok)return false;
    if(q){const num=String(d.id);if(!(ok&&d.n.includes(q))&&!(num===q.replace(/^#?0*/,'')))return false;}
    return true;
  });
  $('#dexList').innerHTML=list.map(d=>{const ok=S.dex[d.id];
    return `<div class="dx${ok?'':' lock'}${d.id===curId()?' cur':''}" data-id="${d.id}"><div class="im"><img data-id="${d.id}" alt=""></div><b>${ok?d.n:'???'}</b><small>#${String(d.id).padStart(4,'0')}</small></div>`;}).join('')
    ||'<div class="note">조건에 맞는 포켓몬이 없습니다.</div>';
  $('#dexList').querySelectorAll('img').forEach(im=>{if(dexIO)dexIO.observe(im);else chain(im,+im.dataset.id);});
  dexInfo();
}
let resetArmed=false;
function renderStats(){
  if(activeTab()!=='tab-stats')return;
  const st=S.stats,rate=st.tries?Math.round(st.ok/st.tries*1000)/10:0;
  const rows=[['총 강화 시도',st.tries.toLocaleString()],['성공 / 성공률',`${st.ok.toLocaleString()} / ${rate}%`],['실패(유지)',st.fail.toLocaleString()],
    ['하락',st.drop.toLocaleString()],['도망(파괴)',st.lost.toLocaleString()],['판매한 포켓몬',st.sold.toLocaleString()],
    ['최고 판매 레벨',st.top?'+'+st.top:'-'],['누적 판매 수익','₽ '+fmt(st.earned)],['누적 강화 지출','₽ '+fmt(st.spent)],['심부름 횟수',st.work.toLocaleString()]];
  $('#tab-stats').innerHTML=`<div class="stats">${rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')}</div>
    <button class="btn danger" id="btnReset">${resetArmed?'정말 삭제할까요? 한 번 더 누르세요':'데이터 초기화'}</button>
    <div class="note">진행 상황은 이 브라우저에 자동 저장됩니다. 판매가는 해당 레벨까지 가는 평균 강화 비용을 기준으로 정해져 있고, 높은 레벨일수록 파괴 위험이 큽니다. 상점의 지닌 물건으로 기대 수익을 끌어올리세요.</div>`;
}

/* =========================================================
   연출
========================================================= */
function burst(color,n=26,spread=140){
  const fx=$('#fx'),r=$('#stage').getBoundingClientRect(),cx=r.width/2,cy=r.height-120;
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='pt';p.style.background=color;p.style.left=cx+'px';p.style.top=cy+'px';
    fx.appendChild(p);
    const a=rnd(0,Math.PI*2),d=rnd(40,spread);
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-30}px) scale(.2)`,opacity:0}],
      {duration:rnd(500,900),easing:'ease-out'}).finished.then(()=>p.remove(),()=>p.remove());
  }
}
function flash(color){
  const f=$('#flash');f.style.background=color;
  f.animate([{opacity:.75},{opacity:0}],{duration:500});
}
function goldFloat(txt,color){
  const g=$('#gfloat');g.textContent=txt;g.style.color=color;
  g.animate([{transform:'translateY(6px)',opacity:0},{transform:'translateY(0)',opacity:1,offset:.2},{transform:'translateY(-18px)',opacity:0}],{duration:1100});
}
const monAnim=(kf,opt)=>$('#monBox').animate(kf,opt).finished.catch(()=>{});

/* =========================================================
   액션
========================================================= */
function enter(){newMon();}
let speed=1;
async function enhance(){
  if(busy||S.lv>=MAX)return;
  const L=S.lv,c=costOf(L);
  if(S.gold<c){log('골드가 부족합니다.','warn');return;}
  busy=true;
  const useLucky=S.armed.lucky&&S.inv.lucky>0,useSure=S.armed.sure&&S.inv.sure>0;
  const rate=rateOf(L);
  S.gold-=c;S.stats.spent+=c;S.stats.tries++;
  if(useSure){S.inv.sure--;}else if(useLucky){S.inv.lucky--;}
  render();
  /* 충전 연출 */
  SFX.charge();
  const box=$('#monBox');box.classList.add('shake');
  burst(tierOf(L).c,10,70);
  await sleep(650*speed);
  box.classList.remove('shake');
  const ok=Math.random()*100<rate;
  const oldName=nameOf(S.hist[L]);
  if(ok){
    const pick=weighted(S.next);
    S.hist.push(pick.id);S.lv=L+1;S.stats.ok++;S.dex[pick.id]=1;
    let msg=`${pick.r?'진화':'변이'} 성공! ${oldName} → <b>${nameOf(pick.id)}</b> (+${S.lv})`;
    if(S.lv>S.best){
      S.best=S.lv;const bonus=Math.round(PRICE[S.lv]*.05);S.gold+=bonus;
      msg+=` · 첫 달성 보너스 ₽${fmt(bonus)}`;
    }
    refreshNext();
    log(msg,'ok');
    S.lv>=20?SFX.big():SFX.ok();
    flash(tierOf(S.lv).c);burst('#ffd23f',40,170);burst(tierOf(S.lv).c,20,120);
    renderStage(true);
    await monAnim([{transform:'scale(.3)',filter:'brightness(4)'},{transform:'scale(1.2)',offset:.6},{transform:'scale(1)',filter:'brightness(1)'}],{duration:520*speed,easing:'ease-out'});
  }else{
    S.stats.fail++;
    const f=failW(L),x=Math.random();
    let out=x<f[0]?'keep':x<f[0]+f[1]?'drop':'lost';
    let guarded=false;
    if(out!=='keep'&&S.armed.protect&&S.inv.protect>0){S.inv.protect--;out='keep';guarded=true;}
    if(out==='keep'){
      log(guarded?`실패… 하지만 ${jo(oldName,'은')} <b>기합의띠</b>로 버텼다!`:`실패… 변화 없음 (${oldName} +${L})`,guarded?'warn':'');
      SFX.fail();flash('#64748b');burst('#94a3b8',14,90);
      await monAnim([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'none'}],{duration:300});
    }else if(out==='drop'){
      S.stats.drop++;S.hist.pop();S.lv=L-1;refreshNext();
      log(`실패… ${jo(oldName,'이')} 약해졌다. ${nameOf(curId())} (+${S.lv})로 하락`,'bad');
      SFX.drop();flash('#dc2626');burst('#ef4444',22,110);
      renderStage(true);
      await monAnim([{transform:'translateY(-30px) scale(1.1)',opacity:.4},{transform:'none',opacity:1}],{duration:400});
    }else{
      S.stats.lost++;
      log(`💥 ${jo(oldName,'이')} 도망쳐 버렸다!! (+${L})`,'bad');
      SFX.boom();flash('#7f1d1d');burst('#ef4444',44,190);
      await monAnim([{transform:'translateX(0)',opacity:1},{transform:'translateX(140%) rotate(25deg)',opacity:0}],{duration:600,easing:'ease-in'});
      enter();renderStage(true);
      await monAnim([{transform:'scale(.2)',opacity:0},{transform:'none',opacity:1}],{duration:350});
      log(`새 포켓몬 <b>${nameOf(curId())}</b>${S.shiny?' ✨이로치!':''} ${S.lv?'(+'+S.lv+') ':''}이(가) 나타났다.`);
    }
  }
  if(S.inv.lucky<=0)S.armed.lucky=false;if(S.inv.sure<=0)S.armed.sure=false;
  save();busy=false;render();
}
function sell(){
  if(busy)return;
  const p=priceOf(),name=nameOf(curId()),L=S.lv;
  S.gold+=p;S.stats.earned+=p;S.stats.sold++;S.stats.top=Math.max(S.stats.top,L);
  log(`${S.shiny?'✨':''}${name} (+${L}) 판매! <b>+₽ ${fmt(p)}</b>`,'gold');
  SFX.coin();goldFloat('+'+fmt(p),'var(--ok)');burst('#ffd23f',18,100);
  enter();renderStage(true);save();render();
  monAnim([{transform:'scale(.2)',opacity:0},{transform:'none',opacity:1}],{duration:350});
}
let workCd=0,workTimer=null;
const workPay=()=>Math.round(15+S.best*10+PRICE[Math.max(0,S.best-6)]*.01);
function work(){
  if(workCd>0)return;
  const p=workPay();S.gold+=p;S.stats.work++;SFX.coin();goldFloat('+'+fmt(p),'var(--gold)');
  workCd=1500;save();render();
  clearInterval(workTimer);
  workTimer=setInterval(()=>{workCd=Math.max(0,workCd-100);$('#btnWork').disabled=workCd>0;$('#workSub').textContent=`+₽ ${fmt(workPay())} · 대기 ${(workCd/1000).toFixed(1)}초`;if(workCd<=0)clearInterval(workTimer);},100);
  $('#btnWork').disabled=true;
}

/* 자동 강화 */
let autoOn=false;
async function autoLoop(){
  if(autoOn)return;autoOn=true;speed=.4;
  $('#btnAuto').textContent='정지';
  const target=()=>+$('#autoRange').value;
  while(autoOn){
    if(busy){await sleep(80);continue;}
    if(S.lv>=target()||S.lv>=MAX){
      if($('#autoSell').checked){sell();await sleep(500);continue;}
      log('자동 강화: 목표 레벨에 도달했습니다.','ok');break;
    }
    if(S.gold<costOf(S.lv)){log('자동 강화 중지: 골드가 부족합니다.','warn');break;}
    await enhance();await sleep(220);
  }
  autoOn=false;speed=1;$('#btnAuto').textContent='시작';
}

/* =========================================================
   이벤트
========================================================= */
$('#tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  SFX.click();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+b.dataset.t));
  resetArmed=false;render();
};
$('#btnEnh').onclick=()=>enhance();
$('#btnSell').onclick=()=>sell();
$('#btnWork').onclick=()=>work();
$('#arm').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const k=b.dataset.k;S.armed[k]=!S.armed[k];
  if(k==='sure'&&S.armed.sure)S.armed.lucky=false;
  if(k==='lucky'&&S.armed.lucky)S.armed.sure=false;
  SFX.click();save();render();
};
$('#autoRange').oninput=()=>{$('#autoT').textContent=$('#autoRange').value;S.auto.target=+$('#autoRange').value;save();};
$('#autoSell').onchange=()=>{S.auto.sell=$('#autoSell').checked;save();};
$('#btnAuto').onclick=()=>{if(autoOn){autoOn=false;}else autoLoop();};
$('#tab-shop').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){
    const it=SHOP_ITEMS.find(x=>x.k===b.dataset.buy),p=it.price();
    if(S.gold<p)return;S.gold-=p;S.inv[it.k]++;
    log(`${it.n} 구매!`,'gold');
  }else if(b.dataset.up){
    const k=b.dataset.up,u=UPS[k],p=upCost(k,S.up[k]);
    if(S.gold<p||S.up[k]>=u.max)return;S.gold-=p;S.up[k]++;
    log(`${u.n} Lv.${S.up[k]} 획득!`,'gold');
  }else if(b.dataset.auto){
    if(S.gold<AUTO_PRICE)return;S.gold-=AUTO_PRICE;S.autoUnlocked=true;log('학습장치를 손에 넣었다! 자동 강화를 쓸 수 있다.','gold');
  }
  SFX.buy();save();render();
};
$('#tab-stats').onclick=e=>{
  if(!e.target.closest('#btnReset'))return;
  if(!resetArmed){resetArmed=true;renderStats();setTimeout(()=>{resetArmed=false;renderStats();},3000);return;}
  autoOn=false;S=DEF();enter();S.log=[];save();resetArmed=false;spriteKey='';render();renderLog();
};
$('#btnSound').onclick=()=>{muted=!muted;$('#btnSound').textContent=muted?'🔇':'🔊';};

/* 시작 */
load();
if(!(S.hist.length&&S.lv===S.hist.length-1&&S.hist.every(id=>BY[id])&&S.types.length)){newMon();}
S.hist.forEach(id=>S.dex[id]=1);
if(!S.next||!S.next.length||!S.next.every(c=>BY[c.id]))refreshNext();
$('#autoRange').value=S.auto.target;$('#autoSell').checked=S.auto.sell;
renderLog();render();loadSprites();
</script>
</body>
</html>
